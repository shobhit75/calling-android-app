name: voice_call_app
description: A voice calling app with team management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.4.0
  flutter_riverpod: ^2.4.9
  signature: ^5.4.0
  pdf: ^3.10.7
  printing: ^5.11.1
  shared_preferences: ^2.2.2
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true